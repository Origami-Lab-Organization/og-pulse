<!doctype html>
<html lang="pt-BR" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Fontes: descobertas já no HTML, não por @import dentro do CSS. O @import obriga o
         navegador a baixar e parsear o CSS antes de sequer saber que a fonte existe, o
         que empurra o LCP. `preconnect` abre a conexão com o gstatic em paralelo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <title>Origami Pulse</title>
    <!--
      Shell da área logada: a Vercel serve este arquivo para toda rota que não é
      a home (ver vercel.json). Guarda dados de clientes, pessoas e finanças, e
      por isso nunca é indexável (skill SEO & GEO do Harness). A vitrine é a home.
    -->
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
