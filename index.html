<!doctype html>
<html lang="pt-BR" class="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="author" content="Origami Lab" />
    <!-- Fontes: descobertas já no HTML, não por @import dentro do CSS. O @import obriga o
         navegador a baixar e parsear o CSS antes de sequer saber que a fonte existe, o
         que empurra o LCP. `preconnect` abre a conexão com o gstatic em paralelo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
    <!--
      Home pública (landing). No build, scripts/prerender-landing.mjs substitui o
      bloco entre os marcadores pelas metatags e pelo JSON-LD gerados de
      src/landing/content.ts, e injeta o HTML da página em #root. O que está aqui
      é só o fallback do ambiente de desenvolvimento.
    -->
    <!--LANDING_HEAD_START-->
    <title>Origami Pulse | Rentabilidade de projetos para empresas de serviços</title>
    <meta name="description" content="Software de PSA para consultorias, agências e escritórios técnicos: pipeline comercial, orçamentos, alocação, horas e margem real por projeto em um só lugar. Teste grátis por 14 dias." />
    <link rel="canonical" href="https://origamipulse.com.br/" />
    <!--LANDING_HEAD_END-->
  </head>

  <body>
    <div id="root"><!--LANDING_BODY--></div>
    <script type="module" src="/src/landing-main.tsx"></script>
  </body>
</html>
