# Lê o site da empresa da Prospecção. A sessão é validada dentro (auth.getUser) e toda
# leitura/escrita passa pela RLS de quem chama, como nas outras funções autenticadas.
[functions.company-site-scan]
verify_jwt = false

# Cruza a empresa com fomento público (BNDES, FINEP, Lei do Bem, Transparência). Sessão
# validada dentro; leitura/escrita sob a RLS de quem chama.
[functions.company-funding-check]
verify_jwt = false

# Gatilhos comerciais: chamada só pelo cron diário. A função confere o Bearer contra a
# service role key; verify_jwt desligado como nos outros notify-* agendados.
[functions.company-watch]
verify_jwt = false

# Integração Conta Azul (ADR-0044). As três validam a sessão dentro (auth.getUser) e exigem
# `integracoes:gerir` no tenant. Escrevem com service role porque token e state não têm
# policy — o navegador nunca vê token.
[functions.conta-azul-connect]
verify_jwt = false

[functions.conta-azul-callback]
verify_jwt = false

[functions.conta-azul-disconnect]
verify_jwt = false

# Sincronização Conta Azul (ADR-0044, parte 2): chamada pelo cron (Bearer da service role,
# conferido dentro) e pelo "Sincronizar agora" (sessão + `integracoes:gerir`, validados dentro).
[functions.conta-azul-sync]
verify_jwt = false
