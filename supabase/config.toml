# Chamada sem sessão: é ela que CRIA a sessão a partir da identidade Microsoft.
# A autenticação real acontece dentro da função, validando o token do Entra ID.
[functions.microsoft-sso]
verify_jwt = false

[functions.send-invite-email]
verify_jwt = false

[functions.create-employee-user]
verify_jwt = false

# FUNC-J1 — reenvio de primeiro acesso. Público (chamado sem sessão na tela de
# login/reenvio), por isso verify_jwt = false.
[functions.request-first-access]
verify_jwt = false

[functions.seed-admin]
verify_jwt = false

[functions.register-tenant]
verify_jwt = false

[functions.recalculate-employee-costs]
verify_jwt = false

[functions.resend-employee-invite]
verify_jwt = false

[functions.parse-cnpj-card]
verify_jwt = false

[functions.market-analysis-start]
verify_jwt = false

[functions.market-analysis-status]
verify_jwt = false

[functions.market-analysis-refine]
verify_jwt = false

[functions.seed-demo-tenant]
verify_jwt = false

[functions.notify-timesheet-reminder]
verify_jwt = false

[functions.notify-timesheet-pending]
verify_jwt = false

[functions.notify-installment-alerts]
verify_jwt = false


# Lê o site da empresa da Prospecção. A sessão é validada dentro (auth.getUser) e toda
# leitura/escrita passa pela RLS de quem chama, como nas outras funções autenticadas.
[functions.company-site-scan]
verify_jwt = false

# Cruza a empresa com fomento público (BNDES, FINEP, Lei do Bem, Transparência). Sessão
# validada dentro; leitura/escrita sob a RLS de quem chama.
[functions.company-funding-check]
verify_jwt = false

# Gatilhos comerciais: chamada só pelo cron diário. A função confere o Bearer contra a
# service role key; verify_jwt desligado como nos outros notify-* agendados.
[functions.company-watch]
verify_jwt = false

# Lei do Bem automática: chamada pelo cron de hora em hora e pelo company-funding-check, sempre
# com a chave de serviço, conferida dentro (ehChamadaDeServico).
[functions.lei-do-bem-sync]
verify_jwt = false

# Lembretes do Meu Kanban (ADR-0050): chamada só pelo cron de minuto em minuto, com a chave de
# serviço conferida dentro (ehChamadaDeServico).
[functions.notify-personal-kanban-reminders]
verify_jwt = false

# Integração Conta Azul (ADR-0044). As três validam a sessão dentro (auth.getUser) e exigem
# `integracoes:gerir` no tenant. Escrevem com service role porque token e state não têm
# policy — o navegador nunca vê token.
[functions.conta-azul-connect]
verify_jwt = false

[functions.conta-azul-callback]
verify_jwt = false

[functions.conta-azul-disconnect]
verify_jwt = false

# Sincronização Conta Azul (ADR-0044, parte 2): chamada pelo cron (Bearer da service role,
# conferido dentro) e pelo "Sincronizar agora" (sessão + `integracoes:gerir`, validados dentro).
[functions.conta-azul-sync]
verify_jwt = false

# Transcrição de reunião (ADR-0039, ADR-0052). As duas chamadas pela tela validam a sessão
# dentro (auth.getUser) e conferem `can_request_meeting_transcription`; a de vínculo também
# valida o id token do Entra. A sincronização é chamada só pelo cron, com a chave de serviço
# conferida dentro (ehChamadaDeServico).
[functions.transcription-enqueue]
verify_jwt = false

[functions.teams-meeting-register]
verify_jwt = false

[functions.teams-transcripts-sync]
verify_jwt = false
