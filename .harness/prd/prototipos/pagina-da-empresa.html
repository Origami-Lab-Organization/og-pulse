<title>Página da Empresa · Índice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra do Pulse com trilha; cabeçalho com identidade, ação e resumo; abaixo, área de trabalho
   com 3 abas (a da fase, Pessoas, Relação com a Origami) e uma ficha lateral fixa com o que não muda.
   Tokens = tema do Pulse (src/index.css). */
:root {
  --background: hsl(60 33.3% 97.6%);
  --foreground: hsl(0 0% 14.5%);
  --card: hsl(0 0% 100%);
  --muted: hsl(65 25% 90.6%);
  --muted-soft: hsl(65 25% 90.6% / .45);
  --muted-foreground: hsl(75 4.9% 32.2%);
  --border: hsl(67 20.5% 84.7%);
  --primary: hsl(159 82.8% 22.7%);
  --primary-hover: hsl(160 82.2% 17.6%);
  --primary-foreground: hsl(0 0% 100%);
  --success-subtle: hsl(150 46.7% 94.1%);
  --success-emphasis: hsl(159 82.8% 22.7%);
  --info-subtle: hsl(200 60% 93%);
  --info-emphasis: hsl(200 68% 28%);
  --warning-subtle: hsl(43 87.5% 90.6%);
  --warning-emphasis: hsl(23 82.5% 31.4%);
  --destructive-subtle: hsl(12 78.9% 92.5%);
  --destructive: hsl(17 88.3% 40.4%);
  --bar: hsl(159 60% 36%);
  --bar-track: hsl(65 25% 90.6%);
  --proto: hsl(0 0% 14.5%);
  --proto-fg: hsl(60 33.3% 97.6%);
  --focus: 0 0 0 3px hsl(159 81.5% 29.6% / .35);
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: hsl(0 0% 10.2%); --foreground: hsl(65 42.9% 94.5%); --card: hsl(0 0% 14.5%);
    --muted: hsl(60 2.2% 18%); --muted-soft: hsl(60 2.2% 18% / .6); --muted-foreground: hsl(64 9.2% 70.2%);
    --border: hsl(60 3.6% 22%);
    --primary: hsl(159 80.2% 54.5%); --primary-hover: hsl(159 82.2% 64.7%); --primary-foreground: hsl(0 0% 14.5%);
    --success-subtle: hsl(159 45% 14%); --success-emphasis: hsl(159 80.2% 60%);
    --info-subtle: hsl(200 45% 16%); --info-emphasis: hsl(200 80% 72%);
    --warning-subtle: hsl(36 50% 16%); --warning-emphasis: hsl(36 89.6% 62.2%);
    --destructive-subtle: hsl(16 50% 16%); --destructive: hsl(16 84.7% 61.6%);
    --bar: hsl(159 70% 48%); --bar-track: hsl(60 2.2% 22%);
    --proto: hsl(60 3.6% 22%); --proto-fg: hsl(65 42.9% 94.5%);
    --focus: 0 0 0 3px hsl(159 80.2% 54.5% / .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: hsl(0 0% 10.2%); --foreground: hsl(65 42.9% 94.5%); --card: hsl(0 0% 14.5%);
  --muted: hsl(60 2.2% 18%); --muted-soft: hsl(60 2.2% 18% / .6); --muted-foreground: hsl(64 9.2% 70.2%);
  --border: hsl(60 3.6% 22%);
  --primary: hsl(159 80.2% 54.5%); --primary-hover: hsl(159 82.2% 64.7%); --primary-foreground: hsl(0 0% 14.5%);
  --success-subtle: hsl(159 45% 14%); --success-emphasis: hsl(159 80.2% 60%);
  --info-subtle: hsl(200 45% 16%); --info-emphasis: hsl(200 80% 72%);
  --warning-subtle: hsl(36 50% 16%); --warning-emphasis: hsl(36 89.6% 62.2%);
  --destructive-subtle: hsl(16 50% 16%); --destructive: hsl(16 84.7% 61.6%);
  --bar: hsl(159 70% 48%); --bar-track: hsl(60 2.2% 22%);
  --proto: hsl(60 3.6% 22%); --proto-fg: hsl(65 42.9% 94.5%);
  --focus: 0 0 0 3px hsl(159 80.2% 54.5% / .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-sans); font-size: 14px; line-height: 1.45; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 13px; height: 13px; }

.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--proto); color: var(--proto-fg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--proto); }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 6px; font-size: 13px; }
.proto-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.proto label { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.proto select { background: transparent; border: 1px solid currentColor; border-radius: 6px; padding: 2px 6px; }
.proto select option { color: hsl(0 0% 14.5%); }

.shell { display: grid; grid-template-columns: 56px minmax(0, 1fr); min-height: calc(100vh - 36px); }
.rail { border-right: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 14px; }
.rail .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); margin-bottom: 12px; }
.rail span { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; color: var(--muted-foreground); }
.rail span.on { background: var(--success-subtle); color: var(--primary); }
.main { min-width: 0; }
.topbar { height: 48px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar a { color: var(--foreground); font-weight: 600; text-decoration: none; }

.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { padding-block: 14px 0; border-bottom: 1px solid var(--border); }
.idrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.id { min-width: 0; display: flex; gap: 14px; align-items: center; }
.logo-co { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; font-weight: 700; color: var(--primary); font-size: 15px; flex: none; }
h1 { font-size: 21px; line-height: 1.2; margin: 0; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sub { margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted-foreground); }
.copy { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 100px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--success-subtle); color: var(--success-emphasis); }
.pill.info { background: var(--info-subtle); color: var(--info-emphasis); }
.pill.warn { background: var(--warning-subtle); color: var(--warning-emphasis); }
.pill.bad { background: var(--destructive-subtle); color: var(--destructive); }
.pill.neutral { background: var(--muted); color: var(--muted-foreground); }
.actions { display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding-inline: 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.outline { background: var(--card); border-color: var(--border); }
.btn.sm { height: 28px; padding-inline: 10px; font-size: 12.5px; }
.btn.icon { width: 34px; padding: 0; justify-content: center; background: var(--card); border-color: var(--border); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; min-width: 190px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px hsl(0 0% 14.5% / .14); padding: 4px; display: grid; }
.menu button { background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; font-size: 13.5px; text-align: left; }
.menu button:hover { background: var(--muted-soft); }
.menu .danger { color: var(--destructive); }

.facts { display: flex; flex-wrap: wrap; margin-top: 12px; gap: 0; }
.fact { flex: 1 1 150px; padding: 2px 16px 2px 0; margin-right: 16px; border-right: 1px solid var(--border); min-width: 0; }
.fact:last-child { border-right: 0; }
.fact .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.fact .v { font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.fact .d { font-size: 12px; color: var(--muted-foreground); }
.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 9px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; white-space: nowrap; border-radius: 0; }
.tab[aria-selected="true"] { color: var(--foreground); border-bottom-color: var(--primary); font-weight: 600; }
.tab .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-foreground); margin-left: 5px; }

/* Área de trabalho + ficha lateral */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr) 280px; gap: 16px; padding-block: 16px 30px; align-items: start; }
.prox { display: grid; gap: 14px; position: sticky; top: 16px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.mini li { display: flex; align-items: center; gap: 9px; padding: 5px 0; min-width: 0; }
.mini .av { width: 26px; height: 26px; font-size: 10.5px; }
.mini b { font-size: 13px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini span.c { font-size: 12px; color: var(--muted-foreground); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .w { min-width: 0; flex: 1; }
.vertodas { margin-top: 6px; background: transparent; border: 0; padding: 0; color: var(--primary); font-size: 12.5px; font-weight: 600; }
.assoc { display: grid; gap: 6px; }
.assoc .a { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.assoc .a b { font-family: var(--font-mono); }
.work { display: grid; gap: 14px; min-width: 0; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.fitgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
.fitgrid .fitrow + .fitrow { margin-top: 0; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card > h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); display: flex; align-items: center; gap: 8px; }
.card > h2 svg { color: var(--primary); }
.card > h2 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }

.side { display: grid; gap: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: sticky; top: 16px; }
.side-h { padding: 14px 16px 2px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); display: flex; align-items: center; gap: 8px; }
.side-h svg { color: var(--primary); }
.sg { border-top: 1px solid var(--border); }
.sg summary { list-style: none; cursor: pointer; padding: 10px 14px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.sg summary::-webkit-details-marker { display: none; }
.sg summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform .15s; }
.sg[open] summary::after { transform: rotate(-135deg); }
.sg .in { padding: 0 14px 12px; display: grid; gap: 5px; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.kv span:first-child { color: var(--muted-foreground); }
.kv span:last-child { min-width: 0; }
.faltam { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 100px; padding: 2px 9px; font-size: 12px; background: var(--card); }
.chip.vazio { border-style: dashed; color: var(--muted-foreground); }
.chip.mono { font-family: var(--font-mono); }

/* Qualificação */
.fitrow { display: grid; grid-template-columns: minmax(0, 1fr) 28px; gap: 3px 10px; align-items: center; }
.fitrow + .fitrow { margin-top: 10px; }
.fitrow .nm { font-size: 13.5px; font-weight: 600; }
.fitrow .sc { font-family: var(--font-mono); font-size: 13px; text-align: right; font-weight: 600; }
.fitrow .bar { grid-column: 1 / -1; height: 7px; border-radius: 100px; background: var(--bar-track); overflow: hidden; }
.fitrow .bar i { display: block; height: 100%; background: var(--bar); border-radius: 100px; }
.fitrow .why { grid-column: 1 / -1; font-size: 12px; color: var(--muted-foreground); }
.bant-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.ring { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ring b { width: 42px; height: 42px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-family: var(--font-mono); font-size: 15px; }
.bant4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.bt { border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; border: 1px solid var(--border); }
.bt .top { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; }
.bt .lt { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
.bt .ev { font-size: 12.5px; line-height: 1.35; }
.bt.ok { background: var(--success-subtle); border-color: transparent; }
.bt.ok .lt { color: var(--success-emphasis); }
.bt.mid { background: var(--warning-subtle); border-color: transparent; }
.bt.mid .lt { color: var(--warning-emphasis); }
.bt.no .lt { color: var(--muted-foreground); }
.ia { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--card); border-radius: 8px; padding: 5px 7px; font-size: 12px; }
.ia .btns { margin-left: auto; display: flex; gap: 4px; }
.ia .btn.sm { height: 24px; padding-inline: 8px; font-size: 12px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.checks .bx { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border); flex: none; }
.notes { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--background); padding: 8px 10px; font-size: 13px; margin-top: 10px; }

/* Pessoas */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted-foreground); padding: 0 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child, .tbl th:first-child { padding-left: 0; }
.tbl td:last-child, .tbl th:last-child { padding-right: 0; text-align: right; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 30px; height: 30px; border-radius: 100px; background: var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; }
.who b { font-weight: 600; display: block; }
.who span { font-size: 12px; color: var(--muted-foreground); }
.scroll { overflow-x: auto; }

/* Relação */
.rel-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rn { border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: var(--card); }
.rn .v { font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
.rn .k { font-size: 12px; color: var(--muted-foreground); }
.year { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--muted-foreground); margin: 4px 0 8px; }
.timeline { list-style: none; margin: 0 0 6px; padding: 0; position: relative; display: grid; gap: 12px; }
.timeline::before { content: ""; position: absolute; left: 13px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.timeline li { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px solid var(--border); z-index: 1; }
.dot.g { border-color: var(--bar); color: var(--success-emphasis); }
.dot.r { border-color: var(--destructive); color: var(--destructive); }
.timeline .tx b { display: block; font-size: 13.5px; font-weight: 600; }
.timeline .tx span { font-size: 12.5px; color: var(--muted-foreground); }
.timeline .dt { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }

/* Oportunidade e projetos */
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.step { display: grid; gap: 6px; text-align: center; font-size: 11.5px; color: var(--muted-foreground); }
.step i { display: block; height: 8px; border-radius: 100px; background: var(--bar-track); }
.step.done i { background: var(--bar); }
.step.now { color: var(--foreground); font-weight: 600; }
.step.now i { background: var(--bar); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--bar); }
.next { display: flex; align-items: center; gap: 12px; border-radius: 10px; padding: 10px 12px; background: var(--info-subtle); color: var(--info-emphasis); }
.next b { display: block; font-size: 14px; }
.next span { font-size: 12.5px; }
.proj { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.proj + .proj { margin-top: 8px; }
.lic { width: 36px; height: 36px; border-radius: 9px; background: var(--muted); display: grid; place-items: center; }
.proj .t { font-weight: 600; font-size: 14px; }
.proj .m { font-size: 12.5px; color: var(--muted-foreground); }
.proj .per { grid-column: 2 / -1; height: 6px; border-radius: 100px; background: var(--bar-track); overflow: hidden; }
.proj .per i { display: block; height: 100%; background: var(--bar); }

@media (max-width: 1280px) { .layout { grid-template-columns: 270px minmax(0, 1fr); } .prox { grid-column: 1 / -1; position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; } }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static; } .fitgrid, .bant4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); } .rail { display: none; }
  .duo, .rel-nums { grid-template-columns: minmax(0, 1fr); }
  .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fact { flex-basis: 45%; border-right: 0; }
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* v9: canais em lista por origem, riscos em lista com estado, linha do tempo horizontal */
.cn-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cn-grupo { padding: 4px 16px 6px; min-width: 0; }
.cn-grupo + .cn-grupo { border-left: 1px solid var(--border); }
.cn-grupo h3 { margin: 10px 0 2px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.cn-l { display: grid; grid-template-columns: 18px 82px minmax(0, 1fr) 30px; align-items: center; gap: 10px; min-height: 44px; padding-block: 6px; border-top: 1px solid var(--border); }
.cn-grupo h3 + .cn-l { border-top: 0; }
.cn-l > svg { color: var(--muted-foreground); }
.cn-k { font-size: 13px; color: var(--muted-foreground); }
.cn-v { font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    return [
      { k: 'site', t: 'Site informado', ok: !!E.site, ir: 'site' },
      { k: 'linkedin', t: 'LinkedIn informado', ok: !!E.linkedin, ir: 'linkedin' },
      { k: 'decisor', t: 'Decisor mapeado', ok: E.decisor, ir: null },
      { k: 'faturamento', t: 'Faturamento confirmado', ok: !!E.faturamento, ir: 'faturamento' },
      { k: 'tipo', t: 'Tipo de conta definido', ok: !!E.tipo, ir: null },
      { k: 'sintese', t: 'Síntese da pesquisa escrita', ok: E.sintese.trim().length > 40, ir: null }
    ];
  }
  var aberto = false;
  function widget() {
    var p = passos(), feitos = p.filter(function (x) { return x.ok; }).length, share = feitos / p.length, R = 2 * Math.PI * 9, tudo = feitos === p.length;
    var status = recemFeito ? 'Pronto · ' + recemFeito : tudo ? 'Pronta para virar Oportunidade' : feitos + ' de ' + p.length + ' passos';
    $('widget').innerHTML =
      (aberto ? '<div class="wpop" role="dialog" aria-label="Próximos passos"><h3>' + ic('clip') + 'Próximos passos da qualificação</h3><ul class="witens">' +
        p.map(function (x) { return '<li class="' + (x.ok ? 'ok' : '') + '"><span class="ck">' + (x.ok ? ic('check') : '') + '</span>' + x.t + (!x.ok && x.ir ? '<button type="button" data-preencher="' + x.ir + '">Preencher</button>' : '') + '</li>'; }).join('') +
        '</ul><div style="display:grid;gap:6px;border-top:1px solid var(--border);padding-top:10px"><span class="muted" style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase">Tipo de conta</span><span class="seg" role="group" aria-label="Tipo de conta" style="display:flex">' +
        TIPOS.map(function (t) { return '<button type="button" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px" data-tipo="' + t[0] + '" aria-pressed="' + (E.tipo === t[0]) + '">' + ic(ICONE_TIPO[t[0]]) + t[0] + '</button>'; }).join('') +
        '</span></div>' + (tudo ? '<button class="btn primary" type="button">' + ic('plus') + 'Criar Oportunidade</button>' : '') + '</div>' : '') +
      '<button class="wbtn' + (recemFeito || tudo ? ' feito' : '') + '" type="button" id="wbtn" aria-expanded="' + aberto + '"><svg viewBox="0 0 22 22" width="26" height="26" style="transform:rotate(-90deg)" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke-width="3" style="stroke:var(--muted)"/><circle cx="11" cy="11" r="9" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + R + '" stroke-dashoffset="' + (R * (1 - share)) + '" style="stroke:var(--bar);transition:stroke-dashoffset .3s"/></svg><span><b>Qualificação</b><span class="s">' + status + '</span></span></button>';
  }
  function marcar(texto, semRender) {
    recemFeito = texto;
    if (!semRender) { idline(); visao(); conteudo(); }
    widget();
    if (texto) setTimeout(function () { recemFeito = null; widget(); }, 2200);
  }

  function editar(el) {
    var k = el.dataset.campo;
    el.innerHTML = '<input id="ed" placeholder="' + (PLACE[k] || '') + '" aria-label="' + (ROTULO[k] || k) + '">';
    var ed = $('ed'); ed.focus();
    var salvo = false;
    function salvar() {
      if (salvo) return; salvo = true;
      var v = ed.value.trim();
      var antes = passos().filter(function (x) { return x.ok; }).length;
      if (k === 'filial') { if (v) E.filiais.push(v); } else if (v) { E[k] = v; }
      var depois = passos().filter(function (x) { return x.ok; }).length;
      var item = passos().filter(function (x) { return x.k === k; })[0];
      marcar(depois > antes && item ? item.t : null);
    }
    ed.addEventListener('keydown', function (e) { if (e.key === 'Enter') salvar(); if (e.key === 'Escape') { salvo = true; idline(); visao(); conteudo(); } });
    ed.addEventListener('blur', salvar);
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-abrir-widget]')) { aberto = true; widget(); return; }
    var tp = e.target.closest('[data-tipo]'); if (tp) { aberto = true; var antes = !!E.tipo; E.tipo = E.tipo === tp.dataset.tipo ? '' : tp.dataset.tipo; marcar(!antes && E.tipo ? 'Tipo de conta definido' : null); return; }
    var ed = e.target.closest('[data-editar]'); if (ed) { var cel = document.querySelector('[data-val="' + ed.dataset.editar + '"]'); cel.dataset.campo = ed.dataset.editar; editar(cel); return; }
    var c = e.target.closest('[data-campo]'); if (c && !c.querySelector('input')) { editar(c); return; }
    var ir = e.target.closest('[data-ir]'); if (ir) { document.getElementById(ir.dataset.ir).scrollIntoView({ block: 'start' }); return; }
    if (e.target.closest('[data-buscar]')) { buscando = !buscando; conteudo(); return; }
    var g = e.target.closest('[data-guardar]'); if (g) { var r = RESULTADOS[Number(g.dataset.guardar)]; E.itens.unshift({ tipo: 'link', titulo: r[0], fonte: r[1] }); conteudo(); return; }
    var nv = e.target.closest('[data-novo]'); if (nv) { novoTipo = nv.dataset.novo; conteudo(); var f = $('n1') || $('n2'); if (f) f.focus(); return; }
    if (e.target.closest('[data-novo-cancelar]')) { novoTipo = null; conteudo(); return; }
    if (e.target.closest('[data-novo-salvar]')) {
      var n1 = $('n1'), n2 = $('n2');
      var titulo = novoTipo === 'arquivo' ? ((n1.files && n1.files[0] && n1.files[0].name) || 'Arquivo') : ((n2 && n2.value) || (n1 && n1.value) || 'Sem título');
      var fonte = novoTipo === 'link' ? (n1.value || '') : novoTipo === 'nota' ? (n1.value || '') : 'agora · você';
      E.itens.unshift({ tipo: novoTipo, titulo: titulo, fonte: fonte }); novoTipo = null; conteudo(); return;
    }
    var pr = e.target.closest('[data-preencher]'); if (pr) { aberto = false; widget(); var id = pr.dataset.preencher; if (id === 'tipo-conta') { $('tipo-conta').scrollIntoView({ block: 'center' }); return; } var alvo = document.querySelector('[data-campo="' + id + '"]'); alvo.scrollIntoView({ block: 'center' }); editar(alvo); return; }
    if (e.target.closest('#wbtn')) { aberto = !aberto; widget(); return; }
    if (aberto && !e.target.closest('.wpop')) { aberto = false; widget(); }
  });
  document.addEventListener('keydown', function (e) {
    var c = e.target.closest && e.target.closest('[data-campo]');
    if (c && (e.key === 'Enter' || e.key === ' ') && !c.querySelector('input')) { e.preventDefault(); editar(c); }
  });

  function indice() {
    var links = Array.prototype.slice.call(document.querySelectorAll('#indice a'));
    links.forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); document.querySelector(a.getAttribute('href')).scrollIntoView({ block: 'start' }); }); });
    if (!('IntersectionObserver' in window)) return;
    var io;
    function observar() {
      if (io) io.disconnect();
      io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { if (en.isIntersecting) { var id = '#' + en.target.id; links.forEach(function (l) { l.classList.toggle('on', l.getAttribute('href') === id); }); } });
      }, { root: $('rola'), rootMargin: '-10% 0px -75% 0px' });
      ['s-qualif', 's-pessoas', 's-canais', 's-riscos', 's-hist', 's-estudo'].forEach(function (id) { var el = document.getElementById(id); if (el) io.observe(el); });
    }
    observar();
    new MutationObserver(observar).observe($('conteudo'), { childList: true });
  }

  idline(); visao(); conteudo(); widget(); indice();
})();
</script>
